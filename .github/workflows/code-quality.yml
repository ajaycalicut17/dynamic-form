name: Code Quality

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist

  pint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    needs: setup

    steps:
    - name: Install Pint
      run: composer require --dev laravel/pint

    - name: Run Pint
      run: vendor/bin/pint --test

  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest
    needs: setup

    steps:
    - name: Install larastan
      run: composer require --dev larastan/larastan

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse app bootstrap database
