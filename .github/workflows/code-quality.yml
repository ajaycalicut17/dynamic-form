  rector:
    name: Rector Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        coverage: none
        tools: rector

    - name: Run rector
      run: rector --dry-run --config .github/rector/rector.php

